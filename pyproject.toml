[project]
name = "zero-students"
version = "0.1.0"
description = "Sparse students of Zero (movingcastles/zero) on Qwen3-8B-Base: loading, inference, and the two eval prompt sets"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51,<5",
    "accelerate",
    "safetensors",
    "huggingface_hub",
]

[tool.setuptools]
packages = ["zero_students"]
